<meta charset="utf-8">
<title>사택 관리 시스템 (오프라인)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  ============================================================================
  사택 관리 오프라인 프로그램 (총무 담당자 전용, 단일 사용자)
  - 완전 오프라인. 서버 없이 크롬/엣지에서 직접 열어 사용.
  - 저장: File System Access API → 지정 폴더의 sasys_data.json 에 즉시 저장.
  - 미지원 브라우저: localStorage 폴백 + JSON 내보내기/가져오기.
  - PDF 파싱: 로컬 pdf.js(pdf.min.js) 존재 시 사용, 없으면 텍스트 붙여넣기 대체.
  - 첨부파일 저장 없음. 텍스트 데이터만 관리.
  ----------------------------------------------------------------------------
  코드 구성(검색용 앵커):
    [STYLE]        디자인 (화이트 + DB Green #00854A)
    [STATE]        전역 상태/데이터 모델
    [STORAGE]      File System Access API / localStorage 저장 계층
    [IDB]          폴더 핸들 영속화(IndexedDB)
    [CHANGELOG]    변경이력 자동기록
    [LIMIT]        한도 검증
    [PDF]          결재 PDF 파싱
    [LIFECYCLE]    계약 라이프사이클(신규/변경/해지/정산/재배정)
    [RENDER]       탭별 화면 렌더링
    [SAMPLE]       샘플 데이터
  ============================================================================
-->
<style>
/* ============================ [STYLE] ============================ */
:root{
  --green:#00854A;          /* DB Green 포인트 */
  --green-d:#006b3c;
  --green-l:#e6f4ee;
  --ink:#1a1a1a;
  --gray:#6b7280;
  --line:#e5e7eb;
  --bg:#f7f8f7;
  --red:#d32f2f;
  --red-l:#fdeaea;
  --amber:#b26a00;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  color:var(--ink); background:var(--bg); font-size:14px; line-height:1.5;
}
button{font-family:inherit;cursor:pointer}
a{color:var(--green)}

/* 헤더: 제목 좌 / 부서·날짜 우, 초록 하단 보더 */
header.app{
  background:#fff; border-bottom:3px solid var(--green);
  padding:14px 22px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:20;
}
header.app .title{font-size:20px;font-weight:800;color:var(--green)}
header.app .title small{color:var(--gray);font-weight:600;font-size:12px;margin-left:8px}
header.app .meta{text-align:right;font-size:12px;color:var(--gray)}
header.app .meta b{color:var(--ink)}

/* 탭 네비 */
nav.tabs{
  background:#fff;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:2px;padding:0 12px;position:sticky;top:52px;z-index:19;
}
nav.tabs button{
  border:none;background:none;padding:11px 15px;font-size:13.5px;font-weight:700;
  color:var(--gray);border-bottom:3px solid transparent;
}
nav.tabs button.active{color:var(--green);border-bottom-color:var(--green)}
nav.tabs button:hover{color:var(--green-d)}

main{max-width:1180px;margin:0 auto;padding:22px 18px 80px}

/* 초록 라벨칩 */
.chip{
  display:inline-block;background:var(--green-l);color:var(--green-d);
  font-weight:800;font-size:12px;padding:4px 11px;border-radius:20px;margin-bottom:12px;
}
.chip.plain{background:#eef1f0;color:var(--gray)}

h2.sec{font-size:16px;margin:26px 0 6px;font-weight:800}

/* 대시보드 카드: 상단 초록 보더 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{
  background:#fff;border:1px solid var(--line);border-top:4px solid var(--green);
  border-radius:10px;padding:16px 18px;
}
.card .lbl{font-size:12.5px;color:var(--gray);font-weight:700}
.card .num{font-size:34px;font-weight:800;color:var(--ink);margin-top:6px;line-height:1.1}
.card .num.g{color:var(--green)}
.card .sub{font-size:11.5px;color:var(--gray);margin-top:4px}
.card.warn{border-top-color:var(--red)}
.card.warn .num{color:var(--red)}

/* 테이블 */
.tblwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#fafbfa;color:var(--gray);font-weight:700;font-size:12px}
tbody tr:hover{background:#fbfdfc}
tbody tr.click{cursor:pointer}
td.wrap,th.wrap{white-space:normal;min-width:180px}

/* 배지(상태) */
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11.5px;font-weight:800}
.b-green{background:var(--green-l);color:var(--green-d)}
.b-gray{background:#eef0ef;color:var(--gray)}
.b-red{background:var(--red-l);color:var(--red)}
.b-amber{background:#fff3e0;color:var(--amber)}
.b-blue{background:#e8f0fe;color:#1a56c4}

/* 버튼 */
.btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700}
.btn:hover{background:var(--green-d)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.ghost{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.btn.ghost:hover{background:var(--green-l)}
.btn.gray{background:#eef0ef;color:var(--ink)}
.btn.danger{background:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}

/* 폼 */
.form{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;color:var(--gray);font-weight:700}
.fld input,.fld select,.fld textarea{
  padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;width:100%;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--green)}
.fld textarea{min-height:64px;resize:vertical}
.fld.over input{border-color:var(--red);background:var(--red-l)}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding:36px 14px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:12px;max-width:860px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .mhead{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:2px solid var(--green)}
.modal .mhead h3{margin:0;font-size:16px;color:var(--green)}
.modal .mbody{padding:18px 20px}
.modal .mfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.x{border:none;background:none;font-size:22px;color:var(--gray);cursor:pointer;line-height:1}

/* 알림 배너 */
.notice{padding:11px 15px;border-radius:9px;font-size:13px;margin-bottom:14px}
.notice.warn{background:var(--red-l);color:var(--red);border:1px solid #f2c9c9}
.notice.info{background:var(--green-l);color:var(--green-d);border:1px solid #bfe3d2}
.notice.gray{background:#f1f3f2;color:var(--gray);border:1px solid var(--line)}

.flag{color:var(--red);font-weight:800}
.muted{color:var(--gray)}
.right{text-align:right}
.small{font-size:12px}
hr.soft{border:none;border-top:1px solid var(--line);margin:18px 0}

/* 타임라인 */
.tl{position:relative;margin:8px 0 0 6px;padding-left:18px;border-left:2px solid var(--green-l)}
.tl .item{position:relative;padding:8px 0 14px}
.tl .item:before{content:"";position:absolute;left:-25px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--green)}
.tl .item .dt{font-size:11.5px;color:var(--gray);font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;font-size:13px;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
.checklist .row{display:grid;grid-template-columns:150px 1fr 130px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.checklist .row .nm{font-weight:700}
.dot-ok{color:var(--green)} .dot-no{color:var(--red)}

/* ===== 좌우 2분할 워크스페이스 ===== */
.strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:9px 14px}
.pill{background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--gray);cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.pill.active{border-color:var(--green);color:var(--green-d);background:var(--green-l)}
.pill b{font-size:14px;color:var(--ink)}
.pill.warn b{color:var(--red)}
.pill .g{color:var(--green)}
.spacer{flex:1}
main.ws{max-width:1300px}
.workspace{display:flex;gap:14px;align-items:flex-start}
.left{width:340px;flex:none;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.right{flex:1;min-width:0}
.left .lhead{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.left .lhead input{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px}
.left .chips{display:flex;gap:5px;flex-wrap:wrap}
.left .chips button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 9px;font-size:11.5px;font-weight:700;color:var(--gray);cursor:pointer}
.left .chips button.on{background:var(--green);color:#fff;border-color:var(--green)}
.llist{max-height:calc(100vh - 240px);overflow:auto}
.litem{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.litem:hover{background:#fbfdfc}
.litem.sel{background:var(--green-l);box-shadow:inset 3px 0 0 var(--green)}
.litem .a1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.litem .addr{font-weight:700;font-size:13px;line-height:1.35}
.litem .sub{font-size:11.5px;color:var(--gray);margin-top:3px}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.panel .phd{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:800;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fafbfa}
.panel .phd span{display:flex;gap:6px;align-items:center}
.panel .pbd{padding:14px}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{flex:1;min-width:66px;text-align:center;font-size:11.5px;font-weight:700;color:var(--gray);padding:7px 4px;border-radius:7px;background:#f1f3f2}
.step.done{background:var(--green-l);color:var(--green-d)}
.step.cur{background:var(--green);color:#fff}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px 14px}
.kv .k{font-size:11.5px;color:var(--gray);font-weight:700}
.kv .v{font-size:13.5px;font-weight:600;margin-top:2px;word-break:break-all}
.empty{padding:48px 20px;text-align:center;color:var(--gray);line-height:1.7}
.rowln{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.rowln:last-child{border-bottom:none}
@media(max-width:860px){ .workspace{flex-direction:column} .left{width:100%} .llist{max-height:360px} }

/* ===== 앱 느낌: 넓은 레이아웃 + 모션/디자인 폴리시 ===== */
main{max-width:1180px}
main.ws{max-width:1780px}
.workspace{gap:16px}
.left{width:384px;border-radius:14px;box-shadow:0 2px 10px rgba(20,40,30,.05)}
.llist{max-height:calc(100vh - 232px)}
/* 부드러운 스크롤바 */
.llist::-webkit-scrollbar{width:8px}
.llist::-webkit-scrollbar-thumb{background:#d7e2dc;border-radius:8px}
.llist::-webkit-scrollbar-thumb:hover{background:#bcd0c6}

/* 헤더 강조 */
header.app{box-shadow:0 1px 0 rgba(0,133,74,.08)}
header.app .title{letter-spacing:-.3px}

/* 진입 애니메이션 */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(-14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}

/* 패널: 라운드/그림자 + 등장 모션(스태거) */
.panel{border-radius:14px;box-shadow:0 2px 10px rgba(20,40,30,.05);border-color:#eef1ef;animation:fadeUp .34s cubic-bezier(.2,.7,.2,1) both}
.right>.panel:nth-child(1){animation-delay:.02s}
.right>.panel:nth-child(2){animation-delay:.06s}
.right>.panel:nth-child(3){animation-delay:.10s}
.right>.panel:nth-child(4){animation-delay:.14s}
.right>.panel:nth-child(5){animation-delay:.18s}
.right>.panel:nth-child(6){animation-delay:.22s}
.right>.panel:nth-child(7){animation-delay:.26s}
.panel .phd{background:linear-gradient(180deg,#fbfdfc,#f6f9f7)}

/* 리스트 아이템 인터랙션 */
.litem{transition:background .16s,box-shadow .16s,transform .12s}
.litem:hover{transform:translateX(3px)}
.litem.sel{box-shadow:inset 4px 0 0 var(--green)}
.litem .addr{transition:color .15s}
.litem:hover .addr{color:var(--green-d)}

/* 버튼: 그림자 + 눌림 모션 */
.btn{transition:transform .09s ease,box-shadow .16s,background .16s;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn:hover{box-shadow:0 4px 14px rgba(0,133,74,.28)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.ghost,.btn.gray{box-shadow:none}
.btn.ghost:hover{box-shadow:0 3px 10px rgba(0,133,74,.14)}

/* 요약 스트립 pill */
.pill{transition:transform .14s,border-color .15s,color .15s,background .15s}
.pill:hover{transform:translateY(-1px);border-color:var(--green);color:var(--green-d)}
.pill.active{box-shadow:0 3px 10px rgba(0,133,74,.15)}
nav.tabs{box-shadow:0 2px 8px rgba(20,40,30,.04)}

/* 필터 칩 */
.left .chips button{transition:all .14s}
.left .chips button:hover{border-color:var(--green);color:var(--green-d)}
.left .chips button.on{box-shadow:0 2px 8px rgba(0,133,74,.22)}

/* 대시보드 카드 hover */
.card{transition:transform .16s,box-shadow .16s;border-radius:14px}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,40,30,.10)}

/* 진행 상태 스텝 */
.step{transition:background .3s,color .3s,transform .2s}
.step.cur{box-shadow:0 4px 14px rgba(0,133,74,.35);animation:pop .3s ease}
.steps{gap:6px}

/* 배지 */
.badge{transition:transform .12s}

/* 모달 등장 */
.overlay{animation:fadeIn .18s ease;backdrop-filter:blur(2px)}
.modal{animation:modalIn .26s cubic-bezier(.2,.8,.2,1);border-radius:16px}
.x{transition:transform .15s,color .15s}
.x:hover{transform:rotate(90deg);color:var(--ink)}

/* 토스트 */
.toast{border-radius:26px;padding:12px 22px;box-shadow:0 10px 30px rgba(0,0,0,.35);background:#12241c}

/* 입력 포커스 */
.fld input:focus,.fld select:focus,.fld textarea:focus,.left .lhead input:focus{box-shadow:0 0 0 3px rgba(0,133,74,.12)}

/* 상단 모드 탭 */
.mnav{display:flex;gap:4px;padding:8px 14px}
.mtab{border:none;background:none;padding:9px 16px;font-size:14px;font-weight:800;color:var(--gray);border-radius:10px;cursor:pointer;transition:all .15s}
.mtab:hover{color:var(--green-d);background:var(--green-l)}
.mtab.active{color:#fff;background:var(--green);box-shadow:0 3px 10px rgba(0,133,74,.25)}

/* 대시보드 카드 그리드 */
.dashgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:14px}

/* 조감도 씬 */
.scene{position:relative;height:480px;border-radius:14px;overflow:hidden;user-select:none;cursor:crosshair;
  background:linear-gradient(180deg,#eef7f2 0%,#e9f3ee 44%,#dfeee6 44%,#d2e7db 100%)}
.scene .sky{position:absolute;left:0;right:0;top:0;height:44%;background:linear-gradient(180deg,#f4faf7,#eaf4ef);pointer-events:none}
.scene .floor{position:absolute;left:0;right:0;top:44%;bottom:0;pointer-events:auto;
  background:
    repeating-linear-gradient(90deg,rgba(0,133,74,.06) 0 1px,transparent 1px 46px),
    repeating-linear-gradient(0deg,rgba(0,133,74,.05) 0 1px,transparent 1px 30px),
    linear-gradient(180deg,#dcece4,#cfe6da)}
.scene .hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:#5a6b63;background:rgba(255,255,255,.75);padding:4px 12px;border-radius:12px;pointer-events:none}
.bld{position:absolute;transform:translate(-50%,-100%);cursor:grab;touch-action:none}
.bld.drag{cursor:grabbing}
.bld .tower{width:66px;height:var(--h);border-radius:5px 5px 0 0;position:relative;box-shadow:0 8px 16px rgba(20,40,30,.22);transition:transform .12s}
.bld:hover .tower{transform:translateY(-3px)}
.bld.ok .tower{background:linear-gradient(180deg,#0a9d59,#00703e)}
.bld.over .tower{background:linear-gradient(180deg,#ef5a42,#c62f1a)}
.bld.vac .tower{background:linear-gradient(180deg,#c0c9c3,#98a49d)}
.bld .roof{position:absolute;top:-5px;left:-3px;right:-3px;height:5px;border-radius:5px 5px 0 0;background:rgba(0,0,0,.28)}
.bld .facade{position:absolute;inset:0;padding:9px 7px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;overflow:hidden}
.bld .wr{display:flex;gap:7px;justify-content:center}
.bld .wr span{width:13px;height:9px;background:rgba(255,255,255,.9);border-radius:1px;box-shadow:inset 0 0 2px rgba(0,0,0,.15)}
.bld.vac .wr span{background:rgba(255,255,255,.55)}
.bld .lbl{position:absolute;bottom:calc(var(--h) + 16px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:700;background:#fff;padding:3px 9px;border-radius:9px;box-shadow:0 3px 10px rgba(0,0,0,.14);text-align:center;line-height:1.35}
.bld .shadow{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);width:78px;height:15px;background:radial-gradient(ellipse,rgba(0,0,0,.24),transparent 70%);border-radius:50%}
.bld .excl{position:absolute;bottom:calc(var(--h) + 48px);left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:#d32f2f;color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 12px rgba(211,47,47,.55);animation:bounce 1.1s ease-in-out infinite;z-index:9}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}

/* 도넛 차트 */
.charts{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-around;padding:8px 0}
.donutbox{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:170px}
.donut{width:150px;height:150px}
.legend{display:flex;flex-direction:column;gap:4px;font-size:12px}
.lg{display:flex;align-items:center;gap:6px}
.dotc{width:10px;height:10px;border-radius:3px;display:inline-block}

/* 월별 표 */
.mtbl{width:100%;border-collapse:collapse;font-size:12px;min-width:900px}
.mtbl th,.mtbl td{border:1px solid var(--line);padding:6px 6px;text-align:center}
.mtbl th:first-child,.mtbl td:first-child{text-align:left;font-weight:800;background:#fafbfa}
.mtbl thead th{background:#f2f6f4;color:var(--gray)}

<script>
/* ============================ [STATE] ============================ */
// 5계층 데이터 모델을 담는 전역 db 객체
const DB_FILE = "sasys_data.json";
let db = emptyDB();
function emptyDB(){
  return {
    version: 1,
    properties: [],   // 1) 사택 물건
    contracts: [],    // 2) 계약 (property 종속, 다건 누적)
    settlements: [],  // 3) 퇴실정산 (해지 계약 1:1)
    issues: [],       // 4) 이슈
    changelog: [],    // 5) 변경이력 (자동기록)
    limits: [],       // 한도 기준표(지역·직급)
    plan: [],         // 1~12월 월세 예산 계획(집행 대비)
    seq: {property:1, contract:1, settlement:1, issue:1}
  };
}
// 상태 상수
const CONTRACT_STATUS = ["신청","계약중","해지예정","해지완료"];
const ISSUE_TYPES = ["누수","소음","집주인분쟁","설비고장","계약분쟁","기타"];
const ISSUE_STATUS = ["접수","진행","종결"];
const SETTLE_ITEMS = [
  {key:"depositReturn", nm:"보증금반환", payer:false},
  {key:"cleaningFee",   nm:"청소비",     payer:true},
  {key:"unpaidMgmtFee", nm:"미납관리비", payer:true},
  {key:"restorationFee",nm:"원상복구비", payer:true},
  {key:"utilityBill",   nm:"공과금정산", payer:true},
  {key:"longTermRepairFund", nm:"장기수선충당금", payer:false, received:true},
];
const PAYERS = ["회사","입주자","집주인"];

let curTab = "dash";
let state = { propFilter:"", selProp:null }; // 화면 임시 상태

/* ID 발급 */
function nextId(kind){ const n = db.seq[kind]++; return kind[0].toUpperCase()+String(n).padStart(4,"0"); }

/* 유틸 */
const $ = (s,r=document)=>r.querySelector(s);
const won = n => (n==null||n==="")?"-":Number(n).toLocaleString("ko-KR")+"원";
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function today(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }

/* ============================ [IDB] 폴더 핸들 영속화 ============================ */
// File System Access 핸들을 IndexedDB에 저장해 재실행 시 복원(권한 재요청)
const IDB_NAME="sasys_idb", IDB_STORE="handles";
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB_NAME,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE);
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbSet(k,v){ const d=await idb(); return new Promise((res,rej)=>{ const t=d.transaction(IDB_STORE,"readwrite"); t.objectStore(IDB_STORE).put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function idbGet(k){ const d=await idb(); return new Promise((res,rej)=>{ const t=d.transaction(IDB_STORE,"readonly"); const rq=t.objectStore(IDB_STORE).get(k); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function idbDel(k){ const d=await idb(); return new Promise((res)=>{ const t=d.transaction(IDB_STORE,"readwrite"); t.objectStore(IDB_STORE).delete(k); t.oncomplete=res; }); }

/* ============================ [STORAGE] 저장 계층 ============================ */
// 지원 여부: File System Access API
const FSA = ("showDirectoryPicker" in window);
let dirHandle=null, fileHandle=null;
let storeMode = FSA ? "fsa" : "local";   // fsa | local
let saveTimer=null;

// 폴더 선택 → 핸들 확보 → 데이터 로드/이관
async function pickFolder(){
  if(!FSA){ toast("이 브라우저는 폴더 저장을 지원하지 않습니다."); return; }
  try{
    dirHandle = await window.showDirectoryPicker({id:"sasys", mode:"readwrite"});
    await idbSet("dir", dirHandle);
    await ensureFileHandle();
    const f = await fileHandle.getFile();
    const txt = await f.text();
    if(txt.trim()){
      // 폴더에 이미 데이터 파일이 있으면 그 내용을 사용
      db = normalize(JSON.parse(txt));
    } else {
      // 파일이 비어 있으면: 폴더 연결 전 입력분(localStorage/샘플)을 이 폴더로 이관 저장
      if(db.properties.length===0){ seedSample(); }
    }
    storeMode="fsa";
    await saveNow();            // 현재 db를 파일에 기록(이관 완료)
    updateStoreState();
    toast("데이터 폴더 연결됨");
    render();
  }catch(e){ if(e.name!=="AbortError") toast("폴더 선택 취소/실패: "+e.message); }
}
async function ensureFileHandle(){
  fileHandle = await dirHandle.getFileHandle(DB_FILE, {create:true});
}
// 권한 확인/요청 (만료 시 재요청 유도)
async function verifyPermission(handle){
  const opts={mode:"readwrite"};
  if((await handle.queryPermission(opts))==="granted") return true;
  if((await handle.requestPermission(opts))==="granted") return true;
  return false;
}
// 파일에서 로드 (없거나 비면 샘플/빈 DB)
async function loadFromFile(){
  const f = await fileHandle.getFile();
  const txt = await f.text();
  if(txt.trim()){ db = normalize(JSON.parse(txt)); }
  else { db = emptyDB(); seedSample(); await saveNow(); }
}
// 즉시 저장 (모든 변경은 즉시 파일에 축적)
async function saveNow(){
  if(storeMode==="fsa" && fileHandle){
    if(!(await verifyPermission(dirHandle))){ updateStoreState(true); toast("폴더 권한 만료 — 재연결 필요"); return; }
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(db,null,2));
    await w.close();
  } else {
    localStorage.setItem("sasys_data", JSON.stringify(db));
  }
  updateStoreState();
}
// 변경 후 호출: 짧은 디바운스로 저장 (연속 입력 대비)
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>saveNow().catch(e=>toast("저장 실패: "+e.message)),120); }

// localStorage 폴백 로드(없으면 샘플 시드)
function loadLocal(){
  const s=localStorage.getItem("sasys_data");
  if(s){ try{ db=normalize(JSON.parse(s)); return; }catch(e){/* 파싱 실패 시 아래로 */} }
  db=emptyDB(); seedSample(); localStorage.setItem("sasys_data",JSON.stringify(db));
}
// 재실행 시 이전 폴더 핸들 복원 시도
async function tryRestore(){
  if(!FSA){ // 폴백: localStorage
    storeMode="local"; loadLocal(); updateStoreState(); return;
  }
  try{
    const h=await idbGet("dir");
    if(h){
      dirHandle=h;
      if(await verifyPermission(dirHandle)){ await ensureFileHandle(); storeMode="fsa"; await loadFromFile(); updateStoreState(); return; }
      else { storeMode="fsa"; updateStoreState(true); return; } // 권한 재요청 필요 (파일 데이터는 재연결 후 로드)
    }
  }catch(e){/* 무시 */}
  // FSA 지원하지만 폴더 미연결: localStorage 폴백으로 이어서 사용(재실행해도 데이터 유지)
  storeMode="local"; loadLocal(); updateStoreState();
}
function updateStoreState(needReconnect=false){
  const el=$("#storeState"); if(!el) return;
  if(storeMode==="local"){ el.innerHTML='💾 로컬 저장(폴백) · <a href="#" onclick="return false" style="color:#6b7280">폴더 저장 미지원</a>'; el.style.color="#b26a00"; return; }
  if(needReconnect){ el.innerHTML='⚠ 폴더 권한 만료 — <a href="#" onclick="pickFolder();return false">재연결</a>'; el.style.color="#d32f2f"; return; }
  if(dirHandle){ el.textContent="✅ 폴더 연결됨 · "+DB_FILE; el.style.color="#00854A"; }
  else { el.innerHTML='📁 <a href="#" onclick="pickFolder();return false">데이터 폴더 선택</a> 필요'; el.style.color="#b26a00"; }
}
// 로드한 데이터 구조 보정(누락 필드 대비)
function normalize(d){
  const base=emptyDB();
  return Object.assign(base, d, {seq:Object.assign(base.seq, d.seq||{})});
}

/* JSON 내보내기/가져오기 백업 */
function exportJSON(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="sasys_backup_"+today()+".json"; a.click();
  URL.revokeObjectURL(a.href);
}
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{ try{ db=normalize(JSON.parse(r.result)); save(); render(); toast("가져오기 완료"); }catch(e){ toast("JSON 파싱 실패"); } };
  r.readAsText(file);
}

/* ============================ [CHANGELOG] 변경이력 자동기록 ============================ */
// 계약 등 수정 시 필드별 전/후 값을 자동으로 기록(필수 요건)
function logChange(table, targetId, field, oldV, newV, reason){
  if(String(oldV??"")===String(newV??"")) return; // 실제 변경만 기록
  db.changelog.push({ timestamp:new Date().toISOString(), targetTable:table, targetId, field, oldValue:oldV??"", newValue:newV??"", reason:reason||"" });
}
// 객체 두 개(old/new)의 지정 필드들을 비교하여 일괄 기록
function logDiff(table, id, oldObj, newObj, fields, reason){
  fields.forEach(f=>logChange(table,id,f,oldObj?.[f],newObj?.[f],reason));
}

/* ============================ [LIMIT] 한도 검증 ============================ */
// 지역별 한도표에서 판정: 전세=보증금≤전세한도, 월세=보증금≤월세보증금한도 & 월세≤월세한도
function judgeLimit(contract){
  const lim = db.limits.find(l=>l.region===contract.region);
  if(!lim) return {result:"미설정", over:false, detail:"해당 지역 한도 미설정"};
  if(contract.contractType==="전세"){
    const over = Number(contract.deposit||0) > Number(lim.jeonseLimit||0);
    return {result:over?"초과":"적정", over, detail:`전세한도 ${won(lim.jeonseLimit)}`};
  } else {
    const overDep = Number(contract.deposit||0) > Number(lim.wolseDepositLimit||0);
    const overRent= Number(contract.monthlyRent||0) > Number(lim.wolseRentLimit||0);
    const over=overDep||overRent;
    return {result:over?"초과":"적정", over, detail:`보증금한도 ${won(lim.wolseDepositLimit)} / 월세한도 ${won(lim.wolseRentLimit)}`};
  }
}

/* ============================ [PDF] 결재 PDF 파싱 ============================ */
// pdf.js 로컬 번들 사용 시도. 없으면 텍스트 붙여넣기 대체안 제공.
let pdfjsLib=null, pdfReady=false;
async function loadPdfJs(){
  if(pdfReady) return !!pdfjsLib;
  pdfReady=true;
  const load=src=>new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  try{
    // 로컬 번들(같은 폴더의 pdf.min.js / pdf.worker.min.js) 로드
    await load("./pdf.min.js");
    pdfjsLib = window.pdfjsLib || null;
    if(!pdfjsLib) throw new Error("no pdfjsLib");
    // 워커 스크립트를 미리 로드해 globalThis.pdfjsWorker 확보
    //  → 파일 직접 실행(file://)에서 Worker 생성이 막혀도 메인스레드 폴백으로 동작
    try{ await load("./pdf.worker.min.js"); }catch(e){}
    try{ pdfjsLib.GlobalWorkerOptions.workerSrc="./pdf.worker.min.js"; }catch(e){}
  }catch(e){ pdfjsLib=null; }
  return !!pdfjsLib;
}
// PDF 파일 → 전체 텍스트 추출
async function extractPdfText(file){
  const ok=await loadPdfJs();
  if(!ok) throw new Error("NO_PDFJS");
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let text="";
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const c=await page.getTextContent();
    text += c.items.map(i=>i.str).join(" ") + "\n";
  }
  return text;
}
// 사택 주소에서 시/도(한도판정 지역) 추정
function guessRegion(addr){
  addr=String(addr||"");
  const map=[["서울","서울"],["부산","부산"],["대구","대구"],["인천","인천"],["광주","광주"],["대전","대전"],
    ["울산","울산"],["세종","세종"],["경기","경기"],["강원","강원"],["충북","충북"],["충남","충남"],
    ["전북","전북"],["전남","전남"],["경북","경북"],["경남","경남"],["제주","제주"]];
  for(const [k,v] of map){ if(addr.includes(k)) return v; }
  return "";
}
// 고정 양식 라벨 기준 필드 추출
function parseApprovalText(text){
  const t = text.replace(/\r/g,"");
  // 같은 줄에 여러 라벨이 붙을 수 있어, 값은 "다음 라벨" 직전에서 잘라낸다.
  const STOP_LABELS=["문서번호","보안등급","문서형식","보존년한","기안자","기안부서","수신부서","작성일","제 목","제목",
    "센터명","성명","사번","연고지 주소","연고지주소","사택 주소","사택주소",
    "계약구분","사용층","전용면적","소유주","소유자","임대인","집주인","보증금 지급금액","보증금지급금액","보증금",
    "월세 지급금액","월세지급금액","월 임대료","월임대료","임대료","월세 지급일","월세지급일","임대료 지급일",
    "연락처","전화","휴대폰","핸드폰","계좌","관리비","결재"];
  // 라벨 뒤 값 추출: 라벨 다음 콜론/공백 후 줄바꿈 또는 다음 라벨 전까지
  function grab(labels){
    for(const lb of labels){
      const re = new RegExp(lb.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*[:：]?\\s*([^\\n]+)");
      const m = t.match(re);
      if(m){
        let v = m[1];
        // 값 안에 다른 라벨이 나타나면 그 앞까지만 사용(자기 자신 라벨은 제외)
        let cut = v.length;
        for(const sl of STOP_LABELS){
          if(lb.indexOf(sl)===0 || sl.indexOf(lb)===0) continue; // 동일/포함 라벨 무시
          const idx = v.indexOf(sl);
          if(idx>0 && idx<cut) cut=idx;
        }
        return v.slice(0,cut).trim().replace(/\s{2,}/g," ").replace(/[:：]\s*$/,"").trim();
      }
    }
    return "";
  }
  const pad=n=>String(n).padStart(2,"0");
  // 문자열에서 전화번호 형태만 추출(없으면 원문 반환)
  function phone(s){ const m=String(s).match(/01[016-9][-.\s]?\d{3,4}[-.\s]?\d{4}|0\d{1,2}[-.\s]?\d{3,4}[-.\s]?\d{4}/); return m?m[0].replace(/\s/g,""):String(s||"").trim(); }

  const ct = grab(["계약구분\\(전/월세\\)","계약구분"]);
  const contractType = /전세/.test(ct)?"전세":(/월세/.test(ct)?"월세":ct);

  // ── 보증금/월세 금액: 이 사택 결재양식은 보증금·월세 표가 뒤엉켜 추출되므로 라벨 대신
  //    금액(원)·지급일 토큰을 직접 인식한다.
  //    실제 예) 보증금 지급금액 5,000,000원 / 월세 450,000원 / 월세지급일 13일(후불)
  const wonAmts=[...t.matchAll(/([\d,]{4,})\s*원/g)].map(m=>Number(m[1].replace(/,/g,"")));
  const depM = t.match(/지급금액\s*([\d,]{4,})\s*원/);         // '지급금액 …원' = 보증금 지급금액
  let deposit = depM? Number(depM[1].replace(/,/g,"")) : (wonAmts.length?Math.max(...wonAmts):"");
  let monthlyRent = "";
  if(contractType!=="전세"){
    const others = wonAmts.filter(a=>a!==deposit);   // 보증금을 제외한 금액 = 월세
    monthlyRent = others.length? others[0] : "";
  }
  // 월세 지급일: 일자(N일)만 추출. 선불/후불은 별도 필드(rentPayType)로 분리.
  const payDayM = t.match(/(\d{1,2})\s*일\s*\(\s*([선후])\s*[불납]?\s*\)/);
  const rentPayDay = payDayM? payDayM[1]+"일" : "";              // 예: "13일" (괄호/선후불 제외)
  const rentPayType = (t.match(/선불|선납|후불|후납/)||[""])[0].replace("선납","선불").replace("후납","후불");
  // 보증금 지급일(계약/입주 기준일 추정) → 시작일 채움
  const kd = t.match(/지급일\s*(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  const startDate = kd? `${kd[1]}-${pad(kd[2])}-${pad(kd[3])}` : "";

  // 결재완료일: 결재선의 '날짜 시:분:초' 타임스탬프 중 최댓값(하단 출력일자 오인 방지)
  const stamps=[...t.matchAll(/(20\d{2})[-.\/](\d{1,2})[-.\/](\d{1,2})\s+\d{1,2}:\d{2}(?::\d{2})?/g)]

/* ============================ [LIFECYCLE] 계약 라이프사이클 ============================ */
// 주소로 기존 property 재사용, 없으면 신규 생성
function findOrCreateProperty(data){
  let p = db.properties.find(x=>x.address && data.address && x.address.replace(/\s/g,"")===data.address.replace(/\s/g,""));
  if(p) return p;
  p = {
    propertyId: nextId("property"),
    address: data.address||"", owner:data.owner||"",
    ownerContact:data.ownerContact||"", ownerAccount:data.ownerAccount||"",
    contractType:data.contractType||"", floor:data.floor||"", area:data.area||"",
    region:data.region||"", status:"공실"
  };
  db.properties.push(p);
  return p;
}
// 신규 계약 저장(검토폼 → 한도판정 → 저장). property=입주중
function saveNewContract(data){
  const prop = findOrCreateProperty(data);
  // property 정보 보완(임대인 이름·연락처·계좌 포함)
  ["owner","ownerContact","ownerAccount","floor","area","region"].forEach(k=>{ if(!prop[k]&&data[k]) prop[k]=data[k]; });
  const c = {
    contractId: nextId("contract"), propertyId: prop.propertyId,
    round:1, renewedFrom:"",
    docNumber:data.docNumber, centerName:data.centerName, tenantName:data.tenantName,
    employeeId:data.employeeId, homeAddress:data.homeAddress, contractType:data.contractType,
    deposit:Number(data.deposit||0), monthlyRent:Number(data.monthlyRent||0),
    rentPayDay:data.rentPayDay||"", rentPayType:data.rentPayType||"",
    startDate:data.startDate||"", endDate:data.endDate||"",
    approvalDate:data.approvalDate||"", region:data.region||prop.region||"",
    limitCheck:data.limitCheck||"", limitReason:data.limitReason||"",
    status:"계약중"
  };
  db.contracts.push(c);
  prop.status="입주중";
  logChange("contract",c.contractId,"status","","계약중","신규 계약 등록 (1회차)");
  save(); return c;
}
// 계약 변경(수정 폼) — changelog 자동기록 + 월세변경 시 한도 재판정
function updateContract(id, newData, reason){
  const c=db.contracts.find(x=>x.contractId===id); if(!c) return;
  const before={...c};
  const fields=["docNumber","centerName","tenantName","employeeId","homeAddress","contractType","deposit","monthlyRent","rentPayDay","rentPayType","startDate","endDate","approvalDate","region","limitCheck","status"];
  Object.assign(c,newData);
  c.deposit=Number(c.deposit||0); c.monthlyRent=Number(c.monthlyRent||0);
  logDiff("contract",id,before,c,fields,reason||"계약 정보 수정");
  save();
}
// 계약 갱신(자동갱신/재계약) — 이전 계약은 '갱신완료'로 닫고 다음 회차 계약을 새로 생성
//   → 회차(round)로 1회차/2회차… 구분, renewedFrom 으로 연결. 이력 보존.
function renewContract(id, data, reason){
  const prev=db.contracts.find(x=>x.contractId===id); if(!prev) return;
  logChange("contract",id,"status",prev.status,"갱신완료",reason||"계약 갱신");
  prev.status="갱신완료";
  const c=Object.assign({}, prev, data, {
    contractId: nextId("contract"),
    round: (prev.round||1)+1,
    renewedFrom: prev.contractId,
    status: "계약중"
  });
  c.deposit=Number(c.deposit||0); c.monthlyRent=Number(c.monthlyRent||0);
  db.contracts.push(c);
  const p=db.properties.find(x=>x.propertyId===c.propertyId); if(p) p.status="입주중";
  // 갱신 시 바뀐 주요 값 기록
  ["deposit","monthlyRent","rentPayDay","rentPayType","startDate","endDate","tenantName","limitCheck"].forEach(f=>logChange("contract",c.contractId,f,prev[f],c[f], (reason||"계약 갱신")+" ("+c.round+"회차)"));
  save(); return c;
}
// 해지: status→해지예정, settlement 자동생성(진행중)
function terminateContract(id){
  const c=db.contracts.find(x=>x.contractId===id); if(!c) return;
  logChange("contract",id,"status",c.status,"해지예정","계약 해지 처리");
  c.status="해지예정";
  if(!db.settlements.find(s=>s.contractId===id)){
    const s={ settlementId:nextId("settlement"), contractId:id, moveOutDate:"", status:"진행중", completedDate:"", notes:"" };
    SETTLE_ITEMS.forEach(it=>{ s[it.key]= it.received?{amount:"",received:false}:(it.payer?{amount:"",payer:""}:{amount:""}); });
    db.settlements.push(s);
  }
  save();
}
// 정산 완료: 체크리스트 전부 입력되면 status→해지완료, property→공실
function completeSettlement(id){
  const s=db.settlements.find(x=>x.settlementId===id); if(!s) return false;
  if(!settlementComplete(s)) return false;
  s.status="완료"; s.completedDate=today();
  const c=db.contracts.find(x=>x.contractId===s.contractId);
  if(c){ logChange("contract",c.contractId,"status",c.status,"해지완료","퇴실정산 완료"); c.status="해지완료";
    const p=db.properties.find(x=>x.propertyId===c.propertyId); if(p) p.status="공실"; }
  save(); return true;
}
// 체크리스트 완결 여부: 모든 항목 금액 입력 + 부담주체 필요한 항목은 주체까지
function settlementComplete(s){
  return SETTLE_ITEMS.every(it=>{
    const v=s[it.key]||{};
    if(v.amount===""||v.amount==null) return false;
    if(it.payer && !v.payer) return false;
    return true;
  });
}

let ui = { screen:"dash", sel:null, filter:"all", q:"", selEmp:null, empQ:"", dashMode:"map" };

// 공용 헬퍼
function prop(id){ return db.properties.find(p=>p.propertyId===id); }
function contract(id){ return db.contracts.find(c=>c.contractId===id); }
function statusBadge(s){ const m={"입주중":"b-green","공실":"b-gray","계약중":"b-green","해지예정":"b-amber","해지완료":"b-gray","갱신완료":"b-blue","신청":"b-blue"}; return `<span class="badge ${m[s]||'b-gray'}">${s}</span>`; }
function roundBadge(n){ return `<span class="badge b-blue">${n||1}회차</span>`; }
function limitBadge(v){ if(v==="초과") return `<span class="badge b-red">초과</span>`; if(v==="적정") return `<span class="badge b-green">적정</span>`; return `<span class="badge b-gray">${v||"-"}</span>`; }
function tbl(cols,body){ return `<div class="tblwrap"><table><thead><tr>${cols.map(c=>`<th class="${/주소|내용|사유/.test(c)?'wrap':''}">${c}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`; }
function kv(k,v){ return `<div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`; }

// 사택의 "현재 계약"(신청/계약중/해지예정 우선, 없으면 최신)
function currentContract(pid){
  const cs=db.contracts.filter(c=>c.propertyId===pid);
  const active=cs.filter(c=>["신청","계약중","해지예정"].includes(c.status)).sort((a,b)=>(a.startDate||"")<(b.startDate||"")?1:-1);
  if(active.length) return active[0];
  return cs.sort((a,b)=>(a.startDate||"")<(b.startDate||"")?1:-1)[0]||null;
}
function settlementProgress(s){ return SETTLE_ITEMS.filter(it=>{const v=s[it.key]||{};return v.amount!==""&&v.amount!=null;}).length; }

// 상단 요약 통계
function stats(){
  const P=db.properties, C=db.contracts;
  const active=C.filter(c=>c.status==="계약중"||c.status==="해지예정");
  return {
    total:P.length,
    occ:P.filter(p=>p.status==="입주중").length,
    vac:P.filter(p=>p.status==="공실").length,
    rent:active.reduce((s,c)=>s+Number(c.monthlyRent||0),0),
    expiring:active.filter(c=>c.endDate&&daysBetween(today(),c.endDate)>=0&&daysBetween(today(),c.endDate)<=60).length,
    settle:db.settlements.filter(s=>s.status!=="완료").length,
    issue:db.issues.filter(i=>i.status!=="종결").length
  };
}

// ── 최상단 모드 탭(#tabs) — 한 번 클릭으로 어디로든 이동 ──
function renderStrip(){
  const tab=(k,label)=>`<button class="mtab ${ui.screen===k?'active':''}" onclick="goScreen('${k}')">${label}</button>`;
  $("#tabs").innerHTML = `<div class="mnav">
    ${tab('dash','📊 대시보드')}
    ${tab('ws','🏢 사택 관리')}
    ${tab('emp','👤 직원 이력')}
    ${tab('settings','⚙ 한도·데이터')}
  </div>`;
}
function goScreen(k){ ui.screen=k; render(); }
// 요약 통계 pill 줄(사택 관리 화면 상단, 클릭 시 필터)
function statPills(){
  const s=stats();
  const pill=(key,label,val,cls="")=>`<button class="pill ${ui.filter===key?'active':''} ${cls}" onclick="setFilter('${key}')">${label} <b>${val}</b></button>`;
  return `<div class="strip">
    ${pill('all','전체',s.total)}${pill('입주중','입주중',s.occ)}${pill('공실','공실',s.vac)}
    <span class="pill" style="cursor:default">이번달 월세 <b class="g">${won(s.rent)}</b></span>
    ${pill('만료임박','만료임박',s.expiring, s.expiring?'warn':'')}${pill('정산중','정산중',s.settle, s.settle?'warn':'')}${pill('이슈','미종결이슈',s.issue, s.issue?'warn':'')}
  </div>`;
}

// 저장소 안내 배너
function storeBanner(){
  if(FSA && !dirHandle) return `<div class="notice warn">⚠ 데이터 폴더 미연결 — 지금 입력은 <b>브라우저에 임시 저장</b>됩니다. 파일 보관하려면 <a href="#" onclick="pickFolder();return false"><b>데이터 폴더 선택</b></a> (연결 시 기존 입력분 이관). <a href="#" onclick="openSettings();return false">설정</a></div>`;
  if(storeMode==="local") return `<div class="notice gray">💾 폴더 저장 미지원 브라우저 — 로컬 저장으로 동작. <b>⚙ 한도·데이터 → JSON 내보내기</b>로 정기 백업하세요.</div>`;
  return "";
}

// ── 메인 렌더 ──
function render(){
  renderStrip();
  const v=$("#view");
  v.className="ws";
  if(ui.screen==="settings"){ v.innerHTML=viewSettings(); return; }
  if(ui.screen==="emp"){ v.innerHTML=viewEmployees(); return; }
  if(ui.screen==="dash"){ v.innerHTML=viewDash(); afterDash(); return; }
  v.innerHTML = storeBanner() + statPills() + `<div class="workspace">
    <aside class="left">${leftList()}</aside>
    <section class="right">${rightPanel()}</section>
  </div>`;
}
function setFilter(k){ ui.filter=k; ui.screen="ws"; render(); }
function selectProp(pid){ ui.sel=pid; ui.screen="ws"; render(); }

// ── 좌측: 사택 목록(마스터) ──
function propInFilter(p,f){
  const c=currentContract(p.propertyId);
  switch(f){
    case "입주중": return p.status==="입주중";
    case "공실": return p.status==="공실";
    case "해지예정": return !!c&&c.status==="해지예정";
    case "정산중": return !!c&&db.settlements.some(x=>x.contractId===c.contractId&&x.status!=="완료");
    case "만료임박": return !!c&&(c.status==="계약중"||c.status==="해지예정")&&c.endDate&&daysBetween(today(),c.endDate)>=0&&daysBetween(today(),c.endDate)<=60;
    case "이슈": return db.issues.some(i=>i.status!=="종결"&&((i.targetType==="property"&&i.targetId===p.propertyId)||(i.targetType==="contract"&&db.contracts.some(cc=>cc.propertyId===p.propertyId&&cc.contractId===i.targetId))));
    default: return true;
  }
}
function leftRows(){
  const q=ui.q.trim();
  let rows=db.properties.filter(p=>propInFilter(p,ui.filter));
  if(q) rows=rows.filter(p=>{ const c=currentContract(p.propertyId); return (p.address+p.owner+p.region+(c?c.tenantName+c.centerName:"")).includes(q); });
  return rows;
}
function leftList(){
  const chips=[["all","전체"],["입주중","입주중"],["공실","공실"],["해지예정","해지예정"],["정산중","정산중"],["만료임박","만료임박"],["이슈","이슈"]];
  return `<div class="lhead">
    <button class="btn" onclick="openNewContract()">＋ 신규 계약 (PDF 업로드)</button>
    <input placeholder="주소·임대인·입주자 검색" value="${esc(ui.q)}" oninput="ui.q=this.value;refreshLeft()">
    <div class="chips">${chips.map(([k,l])=>`<button class="${ui.filter===k?'on':''}" onclick="setFilter('${k}')">${l}</button>`).join("")}</div>
  </div>
  <div class="llist">${leftRows().map(litem).join("")||"<div class='empty'>해당 조건의 사택이 없습니다</div>"}</div>`;
}
function litem(p){
  const c=currentContract(p.propertyId);
  return `<div class="litem ${ui.sel===p.propertyId?'sel':''}" onclick="selectProp('${p.propertyId}')">
    <div class="a1"><div class="addr">${esc(p.address)}</div>${statusBadge(p.status)}</div>
    <div class="sub">${esc(p.region||"-")} · ${c?esc(c.tenantName)+" / "+esc(c.centerName):"입주자 없음"}${c&&c.monthlyRent?" · 월 "+won(c.monthlyRent):""}</div>
  </div>`;
}
// 검색 입력 시 목록만 갱신(입력 포커스 유지)
function refreshLeft(){ const el=document.querySelector(".llist"); if(el) el.innerHTML = leftRows().map(litem).join("")||"<div class='empty'>해당 조건의 사택이 없습니다</div>"; }

// ── 우측: 선택 사택의 모든 것 ──
function rightPanel(){
  if(!ui.sel) return `<div class="panel"><div class="empty">← 왼쪽에서 사택을 선택하면<br><b>계약 · 정산 · 이슈 · 이력</b>이 이 화면에 모두 표시됩니다.<br><br><button class="btn" onclick="openNewContract()">＋ 신규 계약 등록</button></div></div>` + rightOverview();
  const p=prop(ui.sel); if(!p) return "";
  const c=currentContract(p.propertyId);
  return propHeaderPanel(p) + (c? lifecyclePanel(p,c)+contractPanel(p,c)+settlePanel(p,c) : noContractPanel(p)) + issuePanel(p) + historyPanel(p) + changelogPanel(p);
}
function propHeaderPanel(p){
  return `<div class="panel"><div class="pbd" style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
    <div><div style="font-size:17px;font-weight:800">${esc(p.address)}</div>
      <div class="muted small" style="margin-top:3px">${p.propertyId} · ${esc(p.region||"-")} · ${esc(p.contractType||"")} · 전용 ${esc(p.area||"-")} · ${esc(p.floor||"-")}</div></div>
    ${statusBadge(p.status)}
  </div></div>`;
}
function noContractPanel(p){
  return `<div class="panel"><div class="pbd empty">이 사택에 등록된 계약이 없습니다.<br><br><button class="btn" onclick="openNewContract('${p.propertyId}')">＋ 이 사택에 계약 등록</button></div></div>`;
}
function lifecyclePanel(p,c){
  const set=db.settlements.find(s=>s.contractId===c.contractId);
  const steps=["신청","계약중","해지예정","정산","반납완료"];
  let cur=1;
  if(c.status==="신청") cur=0;
  else if(c.status==="계약중") cur=1;
  else if(c.status==="해지예정") cur=(set&&settlementProgress(set)>0)?3:2;
  else if(c.status==="해지완료") cur=4;
  const bar=steps.map((s,i)=>`<div class="step ${i<cur?'done':(i===cur?'cur':'')}">${s}</div>`).join("");
  let acts="";
  if(c.status==="계약중") acts=`<button class="btn sm" onclick="openRenew('${c.contractId}')">🔄 갱신</button><button class="btn sm ghost" onclick="openContract('${c.contractId}')">✏ 변경</button><button class="btn sm gray" onclick="doTerminate('${c.contractId}')">해지</button>`;
  else if(c.status==="해지예정") acts=`<button class="btn sm" onclick="openSettleFor('${c.contractId}')">정산 입력</button><button class="btn sm ghost" onclick="openContract('${c.contractId}')">변경</button>`;
  else if(c.status==="해지완료") acts=`<button class="btn sm" onclick="openNewContract('${p.propertyId}')">＋ 재계약(재배정)</button>`;
  else if(c.status==="신청") acts=`<button class="btn sm" onclick="openContract('${c.contractId}')">검토·확정</button>`;
  return `<div class="panel anim"><div class="phd">진행 상태 <span>${acts}</span></div><div class="pbd"><div class="steps">${bar}</div></div></div>`;
}
function contractPanel(p,c){
  const lim=judgeLimit(c);
  const cnt=db.contracts.filter(x=>x.propertyId===p.propertyId&&x.tenantName===c.tenantName).length;
  return `<div class="panel anim"><div class="phd">현재 계약 · ${c.contractId} <span>${roundBadge(c.round)}${statusBadge(c.status)}${limitBadge(c.limitCheck)}</span></div>
  <div class="pbd"><div class="kv">
    ${kv("입주자",c.tenantName)}${kv("사번",c.employeeId)}${kv("센터",c.centerName)}
    ${kv("계약구분",c.contractType)}${kv("보증금",won(c.deposit))}${kv("월세",c.monthlyRent?won(c.monthlyRent):"-")}
    ${kv("월세 지급일",(c.rentPayDay||"-")+(c.rentPayType?" ("+c.rentPayType+")":""))}
    ${kv("계약기간",(c.startDate||"?")+" ~ "+(c.endDate||"?"))}
    ${kv("계약 회차",(c.round||1)+"회차"+(c.renewedFrom?" (갱신)":" (신규)"))}
    ${kv("결재완료일",c.approvalDate||"-")}${kv("문서번호",c.docNumber||"-")}
    ${kv("연고지",c.homeAddress||"-")}
    ${kv("임대인",p.owner||"-")}${kv("임대인 연락처",p.ownerContact||"-")}${kv("임대인 계좌",p.ownerAccount||"-")}
  </div>
  ${c.limitCheck==="초과"?`<div class="notice warn" style="margin-top:12px">⚠ 한도 초과 — 사유: ${esc(c.limitReason||"(미입력)")} <span class="muted">· ${esc(lim.detail)}</span></div>`:""}
  </div></div>`;
}
function settlePanel(p,c){
  const s=db.settlements.find(x=>x.contractId===c.contractId);
  if(!s) return "";
  const done=SETTLE_ITEMS.filter(it=>{const v=s[it.key]||{};return v.amount!==""&&v.amount!=null&&(!it.payer||v.payer);}).length;
  const rows=SETTLE_ITEMS.map(it=>{const v=s[it.key]||{};const ok=v.amount!==""&&v.amount!=null&&(!it.payer||v.payer);
    return `<div class="rowln"><span>${ok?'<span class="dot-ok">●</span>':'<span class="dot-no">○</span>'} ${it.nm}</span>
      <span>${(v.amount!==""&&v.amount!=null)?won(v.amount):'<span class="muted">미입력</span>'}${it.payer&&v.payer?' · '+v.payer:''}${it.received?(v.received?' · 수령':' · 미수령'):''}</span></div>`;}).join("");
  const btn = s.status==="완료" ? '<span class="badge b-green">완료</span>' : `<button class="btn sm" onclick="openSettleFor('${c.contractId}')">정산 입력</button>`;
  return `<div class="panel"><div class="phd">퇴실 정산 (${done}/${SETTLE_ITEMS.length}) <span>${btn}</span></div>
  <div class="pbd">${rows}${s.notes?`<div class="muted small" style="margin-top:8px">비고: ${esc(s.notes)}</div>`:""}${s.moveOutDate?`<div class="muted small" style="margin-top:6px">퇴실일: ${s.moveOutDate}${s.completedDate?" · 완료일: "+s.completedDate:""}</div>`:""}</div></div>`;
}
function issuePanel(p){
  const cs=db.contracts.filter(c=>c.propertyId===p.propertyId);
  const iss=db.issues.filter(i=>(i.targetType==="property"&&i.targetId===p.propertyId)||(i.targetType==="contract"&&cs.some(c=>c.contractId===i.targetId)))
    .sort((a,b)=>a.occurredDate<b.occurredDate?1:-1);
  return `<div class="panel"><div class="phd">이슈 (${iss.length}) <span><button class="btn sm ghost" onclick="openIssueFor('${p.propertyId}')">＋ 이슈</button></span></div>
  <div class="pbd">${iss.length?iss.map(i=>`<div class="rowln">
    <span><span class="badge ${i.status==='종결'?'b-gray':(i.status==='진행'?'b-amber':'b-blue')}">${i.status}</span> <b>${esc(i.type)}</b> ${esc(i.content)}<div class="muted small">${i.occurredDate}${i.resolution?" · 조치: "+esc(i.resolution):""}</div></span>
    <button class="btn sm ghost" onclick="openIssue('${i.issueId}')">수정</button></div>`).join(""):"<div class='muted small'>등록된 이슈 없음</div>"}</div></div>`;
}
function historyPanel(p){
  const cs=db.contracts.filter(c=>c.propertyId===p.propertyId).sort((a,b)=>(a.startDate||"")<(b.startDate||"")?1:-1);
  if(cs.length<=1) return "";
  return `<div class="panel anim"><div class="phd">계약 이력 (${cs.length}건)</div><div class="pbd">${cs.map(c=>`<div class="rowln click" onclick="openContract('${c.contractId}')" style="cursor:pointer">
    <span>${roundBadge(c.round)} <b>${esc(c.tenantName)}</b> · ${esc(c.centerName)} <span class="muted small">${c.startDate||"?"}~${c.endDate||"?"}${c.renewedFrom?" · 갱신":""}</span></span>
    <span class="small">${c.contractType} ${won(c.deposit)}${c.monthlyRent?" / 월 "+won(c.monthlyRent):""} ${statusBadge(c.status)}</span></div>`).join("")}</div></div>`;
}
function changelogPanel(p){
  const cids=db.contracts.filter(c=>c.propertyId===p.propertyId).map(c=>c.contractId);
  const logs=db.changelog.filter(l=>cids.includes(l.targetId)).slice(-12).reverse();
  if(!logs.length) return "";
  return `<div class="panel"><div class="phd">변경 이력</div><div class="pbd">${logs.map(l=>`<div class="small" style="padding:4px 0;border-bottom:1px solid var(--line)"><span class="muted">${l.timestamp.slice(0,16).replace("T"," ")}</span> · ${esc(l.field)}: <span class="muted">${esc(l.oldValue)||"-"}</span> → <b>${esc(l.newValue)||"-"}</b>${l.reason?` <span class="muted">(${esc(l.reason)})</span>`:""}</div>`).join("")}</div></div>`;
}
// 선택 전 우측 개요(만료임박·미종결이슈)
function rightOverview(){
  const exp=db.contracts.filter(c=>(c.status==="계약중"||c.status==="해지예정")&&c.endDate&&daysBetween(today(),c.endDate)>=0&&daysBetween(today(),c.endDate)<=60).sort((a,b)=>a.endDate<b.endDate?-1:1);
  const iss=db.issues.filter(i=>i.status!=="종결");
  const expH=exp.length?exp.map(c=>{const p=prop(c.propertyId);const d=daysBetween(today(),c.endDate);return `<div class="rowln click" style="cursor:pointer" onclick="selectProp('${c.propertyId}')"><span>${esc(c.tenantName)} · ${esc(p?p.address:"")}</span><span><span class="badge b-amber">D-${d}</span> ${c.endDate}</span></div>`;}).join(""):"<div class='muted small'>없음</div>";
  const issH=iss.length?iss.map(i=>{const tp=i.targetType==="property"?prop(i.targetId):prop((contract(i.targetId)||{}).propertyId);return `<div class="rowln click" style="cursor:pointer" onclick="${tp?`selectProp('${tp.propertyId}')`:''}"><span><b>${esc(i.type)}</b> ${esc(i.content)}</span><span class="badge ${i.status==='진행'?'b-amber':'b-blue'}">${i.status}</span></div>`;}).join(""):"<div class='muted small'>없음</div>";
  return `<div class="panel"><div class="phd">만료 임박 계약 (60일 이내)</div><div class="pbd">${expH}</div></div>
  <div class="panel"><div class="phd">미종결 이슈 (${iss.length})</div><div class="pbd">${issH}</div></div>`;
}

// ── 대시보드(조감도 · 비중 · 월별 계획/집행) ──
function overCount(){ return db.contracts.filter(c=>["계약중","해지예정"].includes(c.status)&&c.limitCheck==="초과").length; }
function setDash(m){ ui.dashMode=m; render(); }
function dashCard(lbl,val,cls,big){ return `<div class="card ${cls==='warn'?'warn':''}"><div class="lbl">${lbl}</div><div class="num ${cls==='g'?'g':''}" ${big?'style="font-size:23px"':''}>${val}</div></div>`; }
function viewDash(){
  const s=stats(), ov=overCount();
  return storeBanner() + `
  <div class="dashgrid">
    ${dashCard("전체 사택",s.total,"g")}
    ${dashCard("입주중",s.occ,"g")}
    ${dashCard("공실",s.vac,"")}
    ${dashCard("이번달 월세",won(s.rent),"g",1)}
    ${dashCard("만료임박(60일)",s.expiring,s.expiring?"warn":"")}
    ${dashCard("정산중",s.settle,s.settle?"warn":"")}
    ${dashCard("한도 초과",ov,ov?"warn":"")}
    ${dashCard("미종결 이슈",s.issue,s.issue?"warn":"")}
  </div>
  <div class="panel"><div class="phd">사택 조감도
    <span><button class="btn sm ${ui.dashMode==='map'?'':'ghost'}" onclick="setDash('map')">🏢 조감도</button>
    <button class="btn sm ${ui.dashMode==='chart'?'':'ghost'}" onclick="setDash('chart')">📊 비중</button></span></div>
    <div class="pbd">${ui.dashMode==='chart'? chartsHTML() : sceneHTML()}</div>
  </div>
  ${monthlyTableHTML()}`;
}
// 건물 조감도(정방향, 바닥 전체, 드래그 배치, 초과=느낌표)
function sceneHTML(){
  const blds=db.properties.map(p=>{
    const c=currentContract(p.propertyId);
    const over=c&&["계약중","해지예정"].includes(c.status)&&c.limitCheck==="초과";
    const vacant=p.status==="공실";
    const val=c?(c.contractType==="전세"?c.deposit/2500000:c.monthlyRent/12000):40;
    const h=Math.max(52,Math.min(190,Math.round(val)));
    const cls=vacant?"vac":(over?"over":"ok");
    const label=c?`${esc(c.tenantName)}<br><b>${c.contractType==="전세"?won(c.deposit):won(c.monthlyRent)+"/월"}</b>`:"<b>공실</b>";
    const floors=Math.max(2,Math.round(h/34)); let win=""; for(let f=0;f<floors;f++) win+=`<div class="wr"><span></span><span></span><span></span></div>`;
    const x=p.vizX==null?50:p.vizX, y=p.vizY==null?70:p.vizY;
    return `<div class="bld ${cls}" data-pid="${p.propertyId}" style="left:${x}%;top:${y}%;--h:${h}px;z-index:${Math.round(y)}" title="${esc(p.address)}">
      ${over?'<div class="excl">!</div>':""}
      <div class="lbl">${label}</div>
      <div class="tower"><div class="roof"></div><div class="facade">${win}</div></div>
      <div class="shadow"></div></div>`;
  }).join("");
  return `<div class="scene" id="scene"><div class="sky"></div><div class="floor"></div>${blds}<div class="hint">건물 드래그 = 위치 이동 · 클릭 = 상세 · 빈 바닥 클릭 = 비중 차트</div></div>`;
}
function afterDash(){
  if(ui.screen!=="dash"||ui.dashMode!=="map") return;
  const scene=document.getElementById("scene"); if(!scene) return;
  scene.querySelectorAll(".bld").forEach(el=>{
    let sx,sy,moved,dragging=false;
    el.addEventListener("pointerdown",e=>{ e.preventDefault(); dragging=true; moved=false; sx=e.clientX; sy=e.clientY; el.setPointerCapture(e.pointerId); el.classList.add("drag"); });
    el.addEventListener("pointermove",e=>{ if(!dragging) return; if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>4) moved=true;
      const r=scene.getBoundingClientRect(); let x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100;
      x=Math.max(3,Math.min(94,x)); y=Math.max(12,Math.min(94,y)); el.style.left=x+"%"; el.style.top=y+"%"; el.style.zIndex=Math.round(y); el._x=x; el._y=y; });
    el.addEventListener("pointerup",e=>{ if(!dragging) return; dragging=false; el.classList.remove("drag"); const pid=el.dataset.pid;
      if(moved){ const p=prop(pid); if(p){ p.vizX=el._x; p.vizY=el._y; save(); } } else { selectProp(pid); } });
  });
  scene.addEventListener("click",e=>{ if(e.target===scene||e.target.classList.contains("floor")||e.target.classList.contains("sky")) setDash("chart"); });
}
// 도넛 차트(항목별 비중)
function donut(title,data){
  const total=data.reduce((s,d)=>s+d.value,0)||1, r=52, CC=2*Math.PI*r; let off=0;
  const segs=data.filter(d=>d.value>0).map(d=>{const frac=d.value/total; const s=`<circle r="${r}" cx="70" cy="70" fill="none" stroke="${d.color}" stroke-width="20" stroke-dasharray="${(frac*CC).toFixed(1)} ${CC.toFixed(1)}" stroke-dashoffset="${(-off*CC).toFixed(1)}" transform="rotate(-90 70 70)" style="transition:stroke-dasharray .5s"/>`; off+=frac; return s;}).join("");
  const legend=data.map(d=>`<div class="lg"><span class="dotc" style="background:${d.color}"></span>${esc(d.label)} <b>${d.value}</b> <span class="muted">${Math.round(d.value/total*100)}%</span></div>`).join("");
  return `<div class="donutbox"><svg viewBox="0 0 140 140" class="donut"><circle r="52" cx="70" cy="70" fill="none" stroke="#eef1ef" stroke-width="20"/>${segs}<text x="70" y="67" text-anchor="middle" font-size="15" font-weight="800" fill="#1a1a1a">${total}</text><text x="70" y="85" text-anchor="middle" font-size="9" fill="#6b7280">${esc(title)}</text></svg><div class="legend">${legend}</div></div>`;
}

// 계약 사용 개월수(종료일 없거나 미래면 오늘까지)
function contractMonths(c){
  if(!c.startDate) return 0;
  let e=c.endDate||today(); if(new Date(e)>new Date(today())) e=today();
  return Math.max(0, daysBetween(c.startDate,e)/30.44);
}
function fmtMonths(m){ const t=Math.round(m); return t>=12? (Math.floor(t/12)+"년 "+(t%12)+"개월") : (t+"개월"); }
function empKey(c){ return c.employeeId||c.tenantName||""; }
// 직원 집계
function employees(){
  const map={};
  db.contracts.forEach(c=>{ const k=empKey(c); if(!k) return; (map[k]=map[k]||{key:k,id:c.employeeId||"",name:c.tenantName||"",contracts:[]}).contracts.push(c); });
  return Object.values(map).map(e=>{
    e.name=e.contracts[0].tenantName; e.id=e.contracts[0].employeeId||"";
    e.months=e.contracts.reduce((s,c)=>s+contractMonths(c),0);
    e.props=new Set(e.contracts.map(c=>c.propertyId)).size;
    const act=e.contracts.find(c=>["계약중","해지예정"].includes(c.status));
    e.current=act?prop(act.propertyId):null;
    e.currentC=act||null;
    return e;
  }).sort((a,b)=>b.months-a.months);
}
// 특정 직원 재직 중 발생 이슈(계약 대상 + 재직기간 내 물건 이슈)
function empIssues(e){
  const out=[];
  e.contracts.forEach(c=>{
    db.issues.forEach(i=>{
      const hit = (i.targetType==="contract"&&i.targetId===c.contractId) ||
        (i.targetType==="property"&&i.targetId===c.propertyId&&c.startDate&&i.occurredDate>=c.startDate&&(!c.endDate||i.occurredDate<=c.endDate));
      if(hit && !out.includes(i)) out.push(i);
    });
  });
  return out.sort((a,b)=>a.occurredDate<b.occurredDate?1:-1);
}

function togglePaste(){ const b=$("#pasteBox"); b.style.display=b.style.display==="none"?"block":"none"; }
async function onPdf(file){
  toast("PDF 파싱 중…");
  try{
    const text=await extractPdfText(file);
    pdfDraft=parseApprovalText(text);
    refreshDraftForm();
    toast("파싱 완료 — 내용을 검토하세요");
  }catch(e){
    if(e.message==="NO_PDFJS"){
      togglePaste();
      $("#pasteBox").insertAdjacentHTML("afterbegin",`<div class="notice warn">로컬 pdf.js(pdf.min.js)가 없어 자동 PDF 파싱을 사용할 수 없습니다. PDF를 연 뒤 전체 텍스트를 복사해 아래에 붙여넣고 <b>텍스트 파싱</b>을 눌러주세요. (또는 아래 폼에 직접 입력)</div>`);
    } else { toast("PDF 파싱 실패: "+e.message); }
  }
}
function parsePasted(){ const t=val("pasteText"); if(!t){toast("텍스트를 붙여넣으세요");return;} pdfDraft=parseApprovalText(t); refreshDraftForm(); toast("파싱 완료 — 검토하세요"); }
function refreshDraftForm(){ const cur=readContractForm(); $("#draftForm").innerHTML=contractFormFields(Object.assign(cur,pdfDraft)); }

// 계약 폼 필드 (신규/수정 공용)
function contractFormFields(d, pid){
  d=d||{};
  const regions=[...new Set(db.limits.map(l=>l.region))];
  return `<div class="grid">
    ${f("문서번호","c_docNumber",d.docNumber)}
    ${f("센터명","c_centerName",d.centerName)}
    ${f("성명(입주자)","c_tenantName",d.tenantName)}
    ${f("사번","c_employeeId",d.employeeId)}
    ${f("연고지 주소","c_homeAddress",d.homeAddress)}
    ${f("사택 주소","c_address",d.address)}
    ${f("소유주(임대인)","c_owner",d.owner)}
    ${f("임대인 연락처","c_ownerContact",d.ownerContact)}
    ${f("임대인 계좌(입금)","c_ownerAccount",d.ownerAccount)}
    ${f("계약구분","c_contractType",d.contractType||"전세","select",["전세","월세"])}
    ${f("사용층","c_floor",d.floor)}
    ${f("전용면적","c_area",d.area)}
    ${f("지역(한도판정)","c_region",d.region|| (regions[0]||""),"select",regions.length?regions:["서울","경기","대전"])}
    ${f("보증금","c_deposit",d.deposit,"number")}
    ${f("월세","c_monthlyRent",d.monthlyRent,"number")}
    ${f("월세 지급일","c_rentPayDay",d.rentPayDay)}
    ${f("선불/후불","c_rentPayType",d.rentPayType||"","select",["","선불","후불"])}
    ${f("계약 시작일","c_startDate",d.startDate,"date")}
    ${f("계약 종료일","c_endDate",d.endDate,"date")}
    ${f("결재 완료일","c_approvalDate",d.approvalDate,"date")}
  </div>
  <div class="notice gray small" style="margin-top:8px">※ 이 결재 PDF 양식에는 <b>임대인 연락처·계좌</b>가 없어 자동으로 채워지지 않습니다. 계약서(첨부)를 보고 직접 입력하세요.</div>
  <div id="limitPreview" style="margin-top:10px"></div>`;
}
function readContractForm(){
  return {
    docNumber:val("c_docNumber"),centerName:val("c_centerName"),tenantName:val("c_tenantName"),
    employeeId:val("c_employeeId"),homeAddress:val("c_homeAddress"),address:val("c_address"),
    owner:val("c_owner"),ownerContact:val("c_ownerContact"),ownerAccount:val("c_ownerAccount"),
    contractType:val("c_contractType"),floor:val("c_floor"),area:val("c_area"),region:val("c_region"),
    deposit:val("c_deposit"),monthlyRent:val("c_monthlyRent"),rentPayDay:val("c_rentPayDay"),rentPayType:val("c_rentPayType"),
    startDate:val("c_startDate"),endDate:val("c_endDate"),approvalDate:val("c_approvalDate")
  };
}
function submitNewContract(pid){
  const d=readContractForm();
  if(!d.address){ toast("사택 주소는 필수입니다"); return; }
  if(!d.tenantName){ toast("입주자 성명은 필수입니다"); return; }
  const j=judgeLimit(d); d.limitCheck=j.result;
  if(j.over){
    const reason=prompt(`⚠ 한도 초과입니다 (${j.detail}).\n초과 사유를 입력해야 저장됩니다:`,"");
    if(!reason){ toast("초과 사유 미입력 — 저장 취소"); return; }
    d.limitReason=reason;
  }
  saveNewContract(d);
  closeModal(); render(); toast("계약 저장됨"+(j.over?" (초과 플래그)":""));
}

/* ---- 계약 수정 ---- */
function openContract(id){
  const c=contract(id); if(!c) return;
  modal("계약 변경 · "+id+" ("+(c.round||1)+"회차)",
    `<div class="notice gray">현재 계약 내용을 <b>수정</b>합니다(같은 회차). 월세·입주자 등 변경 시 <b>변경이력</b>에 전/후 값이 자동 기록되고, 월세 변경 시 한도가 재판정됩니다. <br>계약 기간이 끝나 <b>새 기간으로 이어가는 경우(자동갱신)</b>는 [취소] 후 <b>🔄 갱신</b>을 사용하세요.</div>
     ${contractFormFields(c)}
     <div class="fld" style="margin-top:10px"><label>변경 사유(변경이력에 기록)</label><input id="c_reason" placeholder="예: 월세 인상, 입주자 정보 정정"></div>`,
    `<button class="btn gray" onclick="closeModal()">취소</button>
     <button class="btn" onclick="submitEditContract('${id}')">변경 저장</button>`);
}
function submitEditContract(id){
  const c=contract(id); const d=readContractForm();
  const j=judgeLimit(d); d.limitCheck=j.result;
  if(j.over){
    const reason=prompt(`⚠ 한도 초과 (${j.detail}). 초과 사유 입력:`, c.limitReason||"");
    if(!reason){ toast("초과 사유 미입력 — 저장 취소"); return; }
    d.limitReason=reason;
  }
  updateContract(id, d, val("c_reason"));
  closeModal(); render(); toast("계약 변경 저장 + 변경이력 기록");
}
/* ---- 계약 갱신(자동갱신/재계약) : 다음 회차 신규 생성 ---- */
function openRenew(id){
  const c=contract(id); if(!c) return;
  // 기본값: 시작=기존 종료 다음날, 종료=+1년, 나머지 승계
  const draft={...c};
  if(c.endDate){ const s=new Date(c.endDate); s.setDate(s.getDate()+1); draft.startDate=s.toISOString().slice(0,10);
    const e=new Date(s); e.setFullYear(e.getFullYear()+1); e.setDate(e.getDate()-1); draft.endDate=e.toISOString().slice(0,10); }
  modal("계약 갱신 · "+id+" → "+((c.round||1)+1)+"회차",
    `<div class="notice info">기존 계약을 <b>갱신완료</b>로 닫고 <b>${(c.round||1)+1}회차</b> 계약을 새로 만듭니다. 기간·월세·입주자 등 바뀐 값만 수정하세요. (변경 전/후가 이력에 기록됩니다)</div>
     ${contractFormFields(draft)}
     <div class="fld" style="margin-top:10px"><label>갱신 사유</label><input id="c_reason" placeholder="예: 2년 자동갱신, 월세 5% 인상"></div>`,
    `<button class="btn gray" onclick="closeModal()">취소</button>
     <button class="btn" onclick="submitRenew('${id}')">갱신 확정</button>`);
}
function submitRenew(id){
  const c=contract(id); const d=readContractForm();
  const j=judgeLimit(d); d.limitCheck=j.result;
  if(j.over){
    const reason=prompt(`⚠ 한도 초과 (${j.detail}). 초과 사유 입력:`, c.limitReason||"");
    if(!reason){ toast("초과 사유 미입력 — 갱신 취소"); return; }
    d.limitReason=reason;
  }
  const nc=renewContract(id, d, val("c_reason")||"계약 갱신");
  if(nc) ui.sel=nc.propertyId;
  closeModal(); render(); toast(`갱신 완료 — ${nc.round}회차 계약 생성`);
}
function doTerminate(id){
  if(!confirm("이 계약을 해지 처리합니다.\n(status→해지예정, 퇴실정산 레코드 자동 생성)")) return;
  terminateContract(id);
  const c=contract(id); if(c) ui.sel=c.propertyId;   // 해당 사택 선택 유지 → 우측 정산 패널 노출
  render(); toast("해지 처리 — 아래 '퇴실 정산'에서 항목을 입력하세요");
}

/* ---- 정산 입력 ---- */
function openSettle(id){
  const s=db.settlements.find(x=>x.settlementId===id); if(!s) return;
  const c=contract(s.contractId);
  const rows=SETTLE_ITEMS.map(it=>{
    const v=s[it.key]||{};
    let ctrl=`<input type="number" id="s_${it.key}_amt" value="${v.amount??""}" placeholder="금액" style="width:100%">`;
    let extra="";
    if(it.payer) extra=`<select id="s_${it.key}_payer" style="width:100%"><option value="">부담주체</option>${PAYERS.map(p=>`<option ${v.payer===p?"selected":""}>${p}</option>`).join("")}</select>`;
    else if(it.received) extra=`<label class="small"><input type="checkbox" id="s_${it.key}_recv" ${v.received?"checked":""}> 수령완료</label>`;
    return `<div class="row"><div class="nm">${it.nm}</div><div>${ctrl}</div><div>${extra}</div></div>`;
  }).join("");
  const readonly = s.status==="완료";
  modal("퇴실 정산 · "+id,
    `<div class="small muted">계약 ${s.contractId} · 입주자 ${esc(c?.tenantName||"")}</div>
     <div class="grid" style="margin:10px 0">
       ${f("퇴실일","s_moveOutDate",s.moveOutDate,"date")}
     </div>
     <div class="checklist">
       <div class="row" style="font-weight:800;color:#6b7280"><div>항목</div><div>금액</div><div>부담주체/수령</div></div>
       ${rows}
     </div>
     ${f("비고","s_notes",s.notes,"textarea")}
     <div id="settleWarn" style="margin-top:10px"></div>`,
    readonly? `<button class="btn gray" onclick="closeModal()">닫기</button>`
    : `<button class="btn gray" onclick="closeModal()">닫기</button>
       <button class="btn ghost" onclick="saveSettle('${id}',false)">임시 저장</button>
       <button class="btn" onclick="saveSettle('${id}',true)">정산 완료</button>`);
}
function readSettle(id){
  const s=db.settlements.find(x=>x.settlementId===id);
  s.moveOutDate=val("s_moveOutDate"); s.notes=val("s_notes");
  SETTLE_ITEMS.forEach(it=>{
    const amt=val(`s_${it.key}_amt`);
    const o={amount: amt===""?"":Number(amt)};
    if(it.payer) o.payer=val(`s_${it.key}_payer`);
    if(it.received) o.received=document.getElementById(`s_${it.key}_recv`)?.checked||false;
    s[it.key]=o;
  });
  return s;
}
function saveSettle(id,complete){
  const s=readSettle(id);
  if(complete){
    if(!settlementComplete(s)){ $("#settleWarn").innerHTML=`<div class="notice warn">모든 항목의 금액(및 부담주체)을 입력해야 정산 완료가 가능합니다.</div>`; save(); return; }
    if(completeSettlement(id)){ closeModal(); render(); toast("정산 완료 — 사택이 공실로 전환되었습니다"); return; }
  }
  save(); render(); toast("정산 임시 저장");
  // 모달 유지 상태 갱신 위해 다시 열기
  openSettle(id);
}

/* ---- 이슈 등록/수정 ---- */
function openIssue(id, presetPid){
  const i = id? db.issues.find(x=>x.issueId===id) : {targetType:"property",targetId:presetPid||"",occurredDate:today(),type:"누수",status:"접수"};
  // 대상 선택 옵션
  const propOpts=db.properties.map(p=>`<option value="${p.propertyId}" ${i.targetId===p.propertyId?"selected":""}>${esc(p.address)}</option>`).join("");
  const contOpts=db.contracts.map(c=>`<option value="${c.contractId}" ${i.targetId===c.contractId?"selected":""}>${c.contractId} · ${esc(c.tenantName)}</option>`).join("");
  modal(id?("이슈 수정 · "+id):"이슈 등록",
    `<div class="grid">
       ${f("대상 유형","i_targetType",i.targetType,"select",["property","contract"])}
       <div class="fld"><label>대상</label>
         <select id="i_targetId">${i.targetType==="property"?propOpts:contOpts}</select></div>
       ${f("발생일","i_occurredDate",i.occurredDate,"date")}
       ${f("유형","i_type",i.type,"select",ISSUE_TYPES)}
       ${f("상태","i_status",i.status,"select",ISSUE_STATUS)}
       ${f("종결일","i_closedDate",i.closedDate,"date")}
     </div>
     ${f("내용","i_content",i.content,"textarea")}
     ${f("조치/결과","i_resolution",i.resolution,"textarea")}`,
    `<button class="btn gray" onclick="closeModal()">취소</button>
     <button class="btn" onclick="submitIssue('${id||""}')">저장</button>`);
  // 대상 유형 변경 시 옵션 갱신
  document.getElementById("i_targetType").addEventListener("change",e=>{
    document.getElementById("i_targetId").innerHTML = e.target.value==="property"?propOpts:contOpts;
  });
}
function submitIssue(id){
  const d={ targetType:val("i_targetType"), targetId:val("i_targetId"), occurredDate:val("i_occurredDate"),
    type:val("i_type"), status:val("i_status"), closedDate:val("i_closedDate"),
    content:val("i_content"), resolution:val("i_resolution") };
  if(id){ const i=db.issues.find(x=>x.issueId===id); Object.assign(i,d); }
  else { d.issueId=nextId("issue"); db.issues.push(d); }
  save(); closeModal(); render(); toast("이슈 저장");
}

(async ()=>{
  await tryRestore();   // 저장소 상태에 맞게 db 로드(폴더/로컬/샘플)
  render();
})();
